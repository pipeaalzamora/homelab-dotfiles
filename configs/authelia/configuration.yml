---
# =============================================================
# Authelia — Configuración principal local-first
# Copiar a ${HOMELAB_ROOT}/data/authelia/config/configuration.yml
#
# Los secretos se inyectan desde env/.env mediante variables
# AUTHELIA_* en stacks/security/docker-compose.yml.
# =============================================================

theme: dark

server:
  address: tcp://0.0.0.0:9091/

log:
  level: warn

identity_validation:
  reset_password:
    jwt_lifespan: 5 minutes

totp:
  issuer: homelab-pipe
  period: 30
  skew: 1

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 3
      memory: 65536
      parallelism: 4
      key_length: 32
      salt_length: 16

access_control:
  default_policy: deny
  rules:
    - domain:
        - "*.homelab.local"
        - "homelab.local"
      policy: two_factor

session:
  name: authelia_session
  same_site: lax
  expiration: 1h
  inactivity: 5m
  remember_me: 1M
  cookies:
    - domain: homelab.local
      authelia_url: https://auth.homelab.local
      default_redirection_url: https://homepage.homelab.local
  redis:
    host: authelia-redis
    port: 6379

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 10m

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
