---
# =============================================================
# Authelia — Configuración principal
# Copiar a /srv/data/authelia/config/configuration.yml
# =============================================================

theme: dark
jwt_secret: "{{ AUTHELIA_JWT_SECRET }}"      # Reemplazar con valor de .env

default_redirection_url: https://tudominio.com

server:
  host: 0.0.0.0
  port: 9091
  path: ""

log:
  level: warn

totp:
  issuer: homelab-pipe
  period: 30
  skew: 1

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 3
      memory: 65536
      parallelism: 4
      key_length: 32
      salt_length: 16

access_control:
  default_policy: deny
  rules:
    # Servicios públicos con 2FA
    - domain: "cloud.tudominio.com"
      policy: two_factor
    - domain: "photos.tudominio.com"
      policy: two_factor
    - domain: "vault.tudominio.com"
      policy: two_factor
    - domain: "docs.tudominio.com"
      policy: two_factor
    - domain: "media.tudominio.com"
      policy: one_factor
    # Servicios de admin — solo Tailscale (no deberían llegar aquí)
    - domain: "git.tudominio.com"
      policy: two_factor
    - domain: "wiki.tudominio.com"
      policy: two_factor
    - domain: "flows.tudominio.com"
      policy: two_factor
    - domain: "ci.tudominio.com"
      policy: two_factor

session:
  name: authelia_session
  secret: "{{ AUTHELIA_SESSION_SECRET }}"    # Reemplazar con valor de .env
  expiration: 1h
  inactivity: 5m
  domain: tudominio.com
  redis:
    host: authelia-redis
    port: 6379

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 10m

storage:
  encryption_key: "{{ AUTHELIA_STORAGE_ENCRYPTION_KEY }}"  # Reemplazar con valor de .env
  local:
    path: /config/db.sqlite3

notifier:
  disable_startup_check: false
  # Opción 1: archivo de log (sin SMTP)
  filesystem:
    filename: /config/notification.txt
  # Opción 2: SMTP real (descomentar y configurar)
  # smtp:
  #   host: smtp.gmail.com
  #   port: 587
  #   username: tu@gmail.com
  #   password: APP_PASSWORD
  #   sender: "Homelab <tu@gmail.com>"
  #   subject: "[Homelab] {title}"
