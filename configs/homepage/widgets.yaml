---
# =============================================================
# Homepage — Widgets superiores
# Docs: https://gethomepage.dev/widgets/
# =============================================================

# Saludo
- greeting:
    text_size: xl
    text: Homelab — Pipe Edition

# Recursos del host: CPU, RAM, disco y uptime
- resources:
    label: Sistema
    cpu: true
    memory: true
    disk: /
    uptime: true
    expanded: true

# Fecha y hora
- datetime:
    text_size: xl
    format:
      timeStyle: short
      dateStyle: short
      hourCycle: h23

# Clima — Santiago de Chile (Open-Meteo, sin API key)
- openmeteo:
    label: Santiago
    latitude: -33.4489
    longitude: -70.6693
    timezone: America/Santiago
    units: metric
    cache: 5

# Buscador
- search:
    provider: duckduckgo
    target: _blank
