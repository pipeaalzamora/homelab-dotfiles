# =============================================================
# Stack: PERSONAL
# Nextcloud + OnlyOffice · Immich · Vaultwarden · Paperless-ngx
# Día 2 — Nube personal
# =============================================================

networks:
  homelab:
    external: true

services:

  # -----------------------------------------------------------
  # Nextcloud — Nube privada (archivos, calendario, contactos)
  # -----------------------------------------------------------
  nextcloud-db:
    image: mariadb:10.11
    container_name: nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - /srv/data/nextcloud/db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
    networks:
      - homelab

  nextcloud-redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    networks:
      - homelab

  nextcloud-app:
    image: nextcloud:fpm-alpine
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    volumes:
      - /srv/data/nextcloud/html:/var/www/html
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-cloud.tudominio.com}
      TZ: ${TZ:-America/Santiago}
    networks:
      - homelab

  nextcloud-nginx:
    image: nginx:alpine
    container_name: nextcloud-nginx
    restart: unless-stopped
    depends_on:
      - nextcloud-app
    volumes:
      - /srv/data/nextcloud/html:/var/www/html:ro
      - /srv/homelab/personal/nextcloud-nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8888:80"
    networks:
      - homelab

  # OnlyOffice — editor de documentos para Nextcloud
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${NEXTCLOUD_DB_PASSWORD}   # Usar un secret dedicado en producción
    ports:
      - "8889:80"
    networks:
      - homelab

  # -----------------------------------------------------------
  # Immich — Gestión de fotos (alternativa a Google Photos)
  # -----------------------------------------------------------
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    restart: unless-stopped
    depends_on:
      - immich-db
      - immich-redis
    volumes:
      - /srv/data/immich/upload:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: ${IMMICH_DB_USERNAME:-immich}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: ${IMMICH_DB_DATABASE_NAME:-immich}
      REDIS_HOSTNAME: immich-redis
      TZ: ${TZ:-America/Santiago}
    ports:
      - "2283:3001"
    networks:
      - homelab

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-ml
    restart: unless-stopped
    volumes:
      - /srv/data/immich/upload:/usr/src/app/upload
    environment:
      TZ: ${TZ:-America/Santiago}
    networks:
      - homelab

  immich-db:
    image: tensorchord/pgvecto-rs:pg16-v0.2.0
    container_name: immich-db
    restart: unless-stopped
    volumes:
      - /srv/data/immich/db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${IMMICH_DB_USERNAME:-immich}
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME:-immich}
    networks:
      - homelab

  immich-redis:
    image: redis:7-alpine
    container_name: immich-redis
    restart: unless-stopped
    networks:
      - homelab

  # -----------------------------------------------------------
  # Vaultwarden — Gestor de contraseñas (compatible Bitwarden)
  # -----------------------------------------------------------
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - /srv/data/vaultwarden:/data
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN:-https://vault.tudominio.com}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      SIGNUPS_ALLOWED: "false"       # Deshabilitar registros públicos
      INVITATIONS_ALLOWED: "true"
      TZ: ${TZ:-America/Santiago}
    ports:
      - "8080:80"
    networks:
      - homelab

  # -----------------------------------------------------------
  # Paperless-ngx — Gestión de documentos escaneados
  # -----------------------------------------------------------
  paperless-broker:
    image: redis:7-alpine
    container_name: paperless-broker
    restart: unless-stopped
    networks:
      - homelab

  paperless-db:
    image: postgres:15-alpine
    container_name: paperless-db
    restart: unless-stopped
    volumes:
      - /srv/data/paperless/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
    networks:
      - homelab

  paperless-webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - paperless-db
      - paperless-broker
    volumes:
      - /srv/data/paperless/data:/usr/src/paperless/data
      - /srv/data/paperless/media:/usr/src/paperless/media
      - /srv/data/paperless/export:/usr/src/paperless/export
      - /srv/data/paperless/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_TIME_ZONE: ${TZ:-America/Santiago}
      PAPERLESS_OCR_LANGUAGE: spa+eng
      USERMAP_UID: ${PUID:-1000}
      USERMAP_GID: ${PGID:-1000}
    ports:
      - "8010:8000"
    networks:
      - homelab
