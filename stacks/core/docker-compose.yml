services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "3000:8000"
      - "3001:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOMELAB_ROOT}/data/portainer:/data
    networks:
      - homelab

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - TASKS=1
      - NODES=1
      - INFO=1
      - VERSION=1
      - EVENTS=1
      - NETWORKS=1
      - VOLUMES=1
    networks:
      - homelab

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3100:3000"
    volumes:
      - ${HOMELAB_ROOT}/data/homepage:/app/config
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - HOMEPAGE_ALLOWED_HOSTS=192.168.1.5:3100
    networks:
      - homelab

networks:
  homelab:
    external: true
