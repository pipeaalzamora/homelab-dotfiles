version: '3.8'

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "8080:8000"
      - "8081:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOMELAB_ROOT}/data/portainer:/data
    networks:
      - homelab
    labels:
      - "homepage.group=Core"
      - "homepage.name=Portainer"
      - "homepage.description=Gestió±±±n de contenedores Docker"
      - "homepage.icon=docker.svg"
      - "homepage.href=http://${LAN_IP}:8081"

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - TASKS=1
      - NODES=1
      - INFO=1
      - VERSION=1
      - EVENTS=1
      - NETWORKS=1
      - VOLUMES=1
    networks:
      - homelab
    labels:
      - "homepage.group=Core"
      - "homepage.name=Docker Socket Proxy"
      - "homepage.description=Proxy seguro para socket de Docker (Homepage)"
      - "homepage.icon=docker.svg"

networks:
  homelab:
    external: true
