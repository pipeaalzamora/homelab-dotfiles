# =============================================================
# Stack: CORE LOCAL
# Portainer · Nginx Proxy Manager · AdGuard Home · Homepage · Uptime Kuma
# Base del homelab local-first
# =============================================================

networks:
  homelab:
    external: true

volumes:
  portainer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/data/portainer

services:

  portainer:
    image: portainer/portainer-ce:2.21.5
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    ports:
      - "127.0.0.1:9443:9443"
    networks:
      - homelab

  npm:
    image: jc21/nginx-proxy-manager:2.12.2
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81"
    volumes:
      - /srv/data/npm/data:/data
      - /srv/data/npm/letsencrypt:/etc/letsencrypt
    environment:
      TZ: ${TZ:-America/Santiago}
    networks:
      - homelab

  adguard:
    image: adguard/adguardhome:v0.107.53
    container_name: adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "127.0.0.1:3000:3000/tcp"
      - "127.0.0.1:8080:80/tcp"
    volumes:
      - /srv/data/adguard/work:/opt/adguardhome/work
      - /srv/data/adguard/conf:/opt/adguardhome/conf
    environment:
      TZ: ${TZ:-America/Santiago}
    networks:
      - homelab

  homepage:
    image: ghcr.io/gethomepage/homepage:v0.10.9
    container_name: homepage
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Santiago}
    volumes:
      - /srv/data/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3001:3000"
    networks:
      - homelab

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Santiago}
    volumes:
      - /srv/data/uptime-kuma:/app/data
    ports:
      - "127.0.0.1:3002:3001"
    networks:
      - homelab
