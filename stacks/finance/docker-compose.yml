# =============================================================
# Stack: FINANCE
# Facto — herramienta de contabilidad familiar
# https://github.com/nymanjens/facto
# Puerto UI: 127.0.0.1:${FACTO_PORT:-8086}
#
# PRIMERA VEZ — ejecutar antes de levantar el stack:
#   cd homelab-dotfiles && bash stacks/finance/init-facto.sh
# =============================================================

networks:
  homelab:
    external: true

services:

  # -----------------------------------------------------------
  # MariaDB — base de datos de Facto
  # -----------------------------------------------------------
  facto-db:
    image: mariadb:10.11
    container_name: facto-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${FACTO_DB_ROOT_PASSWORD:-facto}
      MYSQL_DATABASE: facto
      MYSQL_USER: facto
      MYSQL_PASSWORD: ${FACTO_DB_PASSWORD:-facto}
    volumes:
      - ${HOMELAB_ROOT:-/srv}/data/facto/db:/var/lib/mysql
    networks:
      - homelab

  # -----------------------------------------------------------
  # Facto — contabilidad familiar en pesos chilenos
  # UI: http://127.0.0.1:${FACTO_PORT:-8086}  usuario: admin / changeme
  # Cambiar contraseña en /app/useradministration tras el 1er login
  # -----------------------------------------------------------
  facto:
    image: nymanjens/facto:latest
    container_name: facto
    restart: unless-stopped
    depends_on:
      - facto-db
    command: bin/server
    environment:
      APPLICATION_SECRET: ${FACTO_SECRET:-cambia_este_secreto_ahora_por_favor}
      DATABASE_URL: "jdbc:mysql://facto-db:3306/facto?user=facto&password=${FACTO_DB_PASSWORD:-facto}&disableMariaDbDriver"
      TZ: ${TZ:-America/Santiago}
      # Locale chileno y lectura UTF-8 para textos con acentos.
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Duser.language=es -Duser.country=CL"
      LANG: es_CL.UTF-8
    volumes:
      # Config personalizada con pesos chilenos montada sobre la del contenedor
      - ${HOMELAB_ROOT:-/srv}/data/facto/config/accounting-config.yml:/app/conf/accounting-config.yml:ro
    ports:
      - "127.0.0.1:${FACTO_PORT:-8086}:9000"
    networks:
      - homelab
