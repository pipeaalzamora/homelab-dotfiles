services:
  securo-postgres:
    image: pgvector/pgvector:pg16
    container_name: securo-postgres
    restart: unless-stopped
    volumes:
      - ${HOMELAB_ROOT}/data/finance/securo-postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=securo
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  securo-redis:
    image: redis:8-alpine
    container_name: securo-redis
    restart: unless-stopped
    volumes:
      - ${HOMELAB_ROOT}/data/finance/securo-redis:/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  securo-backend:
    image: ghcr.io/securo-finance/securo-backend:latest
    container_name: securo-backend
    restart: unless-stopped
    ports:
      - "3014:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ${HOMELAB_ROOT}/data/finance/securo-attachments:/app/data/attachments
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@securo-postgres/securo
      - REDIS_URL=redis://securo-redis:6379/0
      - SECRET_KEY=change_this_to_a_random_64_char_secret_key_please
      - FRONTEND_URL=http://${LAN_IP}:3013
      - BACKEND_URL=http://${LAN_IP}:3014
      - STORAGE_LOCAL_PATH=/app/data/attachments
    depends_on:
      securo-postgres:
        condition: service_healthy
      securo-redis:
        condition: service_healthy
    networks:
      - homelab

  securo-frontend:
    image: ghcr.io/securo-finance/securo-frontend:latest
    container_name: securo-frontend
    restart: unless-stopped
    ports:
      - "3013:8080"
    environment:
      - BACKEND_URL=http://securo-backend:8000
      - FRONTEND_URL=http://${LAN_IP}:3013
    depends_on:
      - securo-backend
    networks:
      - homelab

  securo-celery-worker:
    image: ghcr.io/securo-finance/securo-backend:latest
    container_name: securo-celery-worker
    restart: unless-stopped
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    volumes:
      - ${HOMELAB_ROOT}/data/finance/securo-attachments:/app/data/attachments
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@securo-postgres/securo
      - REDIS_URL=redis://securo-redis:6379/0
      - SECRET_KEY=change_this_to_a_random_64_char_secret_key_please
      - STORAGE_LOCAL_PATH=/app/data/attachments
    depends_on:
      securo-postgres:
        condition: service_healthy
      securo-redis:
        condition: service_healthy
    networks:
      - homelab

  securo-celery-beat:
    image: ghcr.io/securo-finance/securo-backend:latest
    container_name: securo-celery-beat
    restart: unless-stopped
    command: celery -A app.worker beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@securo-postgres/securo
      - REDIS_URL=redis://securo-redis:6379/0
      - SECRET_KEY=change_this_to_a_random_64_char_secret_key_please
      - STORAGE_LOCAL_PATH=/app/data/attachments
    depends_on:
      securo-postgres:
        condition: service_healthy
      securo-redis:
        condition: service_healthy
    networks:
      - homelab

networks:
  homelab:
    external: true
