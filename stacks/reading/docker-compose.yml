version: '3.8'

services:
  bookorbit:
    image: ghcr.io/bookorbit/bookorbit:latest
    container_name: bookorbit
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - ${HOMELAB_ROOT}/data/reading/bookorbit:/app/data
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - homelab
    labels:
      - "homepage.group=Reading"
      - "homepage.name=BookOrbit"
      - "homepage.description=Biblioteca de lectura (ebooks, audiobooks, cómics)"
      - "homepage.icon=book-open.svg"
      - "homepage.href=http://${LAN_IP}:8090"

networks:
  homelab:
    external: true
