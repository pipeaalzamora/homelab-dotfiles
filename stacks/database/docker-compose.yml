services:
  baserow:
    image: baserow/baserow:latest
    container_name: baserow
    restart: unless-stopped
    ports:
      - "3010:80"
    volumes:
      - ${HOMELAB_ROOT}/data/baserow:/baserow/data
    environment:
      - BASEROW_PUBLIC_URL=http://${LAN_IP}:3010
      - BASEROW_JWT_SECRET=${BASEROW_JWT_SECRET:?defini BASEROW_JWT_SECRET en .env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/_health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      - homelab

networks:
  homelab:
    external: true
