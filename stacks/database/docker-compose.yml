services:
  baserow:
    image: baserow/baserow:latest
    container_name: baserow
    restart: unless-stopped
    ports:
      - "3010:80"
    volumes:
      - ${HOMELAB_ROOT}/data/baserow:/baserow/data
    environment:
      - BASEROW_PUBLIC_URL=http://192.168.1.5:3010
      - BASEROW_JWT_SECRET=ed3cda6c2c586329e6711daf2879807e5ac19bccab8a6ee591fb42f639a12a27
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/user/token-auth/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      - homelab

networks:
  homelab:
    external: true
