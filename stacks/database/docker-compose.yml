services:
  baserow:
    image: baserow/baserow:latest
    container_name: baserow
    restart: unless-stopped
    ports:
      - "3010:80"
    volumes:
      - ${HOMELAB_ROOT}/data/baserow:/baserow/data
    environment:
      - BASEROW_PUBLIC_URL=http://192.168.1.2:3010
      - BASEROW_JWT_SECRET=ed3cda6c2c586329e6711daf2879807e5ac19bccab8a6ee591fb42f639a12a27
      - BASEROW_EMAIL_SMTP_HOST=
      - BASEROW_EMAIL_SMTP_PORT=
      - BASEROW_EMAIL_SMTP_USER=
      - BASEROW_EMAIL_SMTP_PASSWORD=
      - BASEROW_EMAIL_SMTP_USE_TLS=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - homelab

networks:
  homelab:
    external: true
