# =============================================================
# Stack: SECURITY
# Authelia (SSO) + Redis
# Día 6 — Autenticación centralizada para servicios públicos
#
# Local-first: el puerto queda publicado en 127.0.0.1.
# Para usarlo con reverse proxy real, ajusta el dominio de sesión
# en configs/authelia/configuration.yml.
# =============================================================

networks:
  homelab:
    external: true

services:

  # -----------------------------------------------------------
  # Redis — Backend de sesiones para Authelia
  # -----------------------------------------------------------
  authelia-redis:
    image: redis:7-alpine
    container_name: authelia-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks:
      - homelab

  # -----------------------------------------------------------
  # Authelia — SSO + 2FA delante de servicios públicos
  # Puerto: 9091
  # Config en: ${HOMELAB_ROOT}/data/authelia/config/
  # -----------------------------------------------------------
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    depends_on:
      - authelia-redis
    environment:
      TZ: ${TZ:-America/Santiago}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET:?set AUTHELIA_JWT_SECRET}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?set AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?set AUTHELIA_STORAGE_ENCRYPTION_KEY}
    volumes:
      - ${HOMELAB_ROOT:-/srv}/data/authelia/config:/config
    ports:
      - "127.0.0.1:${AUTHELIA_PORT:-9091}:9091"
    networks:
      - homelab
