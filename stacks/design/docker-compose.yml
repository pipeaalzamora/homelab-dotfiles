version: '3.8'

services:
  penpot-postgres:
    image: postgres:15-alpine
    container_name: penpot-postgres
    restart: unless-stopped
    volumes:
      - ${HOMELAB_ROOT}/data/design/penpot-postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=penpot
      - POSTGRES_USER=penpot
      - POSTGRES_PASSWORD=penpot_password_change_me
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot -d penpot"]
      interval: 10s
      timeout: 5s
      retries: 5

  penpot-redis:
    image: redis:7-alpine
    container_name: penpot-redis
    restart: unless-stopped
    volumes:
      - ${HOMELAB_ROOT}/data/design/penpot-redis:/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  penpot-backend:
    image: ghcr.io/penpot/penpot-backend:latest
    container_name: penpot-backend
    restart: unless-stopped
    volumes:
      - ${HOMELAB_ROOT}/data/design/penpot-assets:/opt/penpot/assets
    environment:
      - PENPOT_DATABASE_URI=postgresql://penpot-postgres/penpot
      - PENPOT_REDIS_URI=redis://penpot-redis/0
      - PENPOT_SECRET_KEY=change_this_to_a_random_64_char_secret_key_please
      - PENPOT_PUBLIC_URI=http://${LAN_IP}:3012
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-redis:
        condition: service_healthy
    networks:
      - homelab

  penpot-frontend:
    image: ghcr.io/penpot/penpot-frontend:latest
    container_name: penpot-frontend
    restart: unless-stopped
    ports:
      - "3012:80"
    volumes:
      - ${HOMELAB_ROOT}/data/design/penpot-assets:/opt/penpot/assets:ro
    environment:
      - PENPOT_BACKEND_URI=http://penpot-backend:6060
    depends_on:
      - penpot-backend
    networks:
      - homelab
    labels:
      - "homepage.group=Design"
      - "homepage.name=Penpot"
      - "homepage.description=Plataforma de diseño UI/UX (alternativa a Figma)"
      - "homepage.icon=penpot.svg"
      - "homepage.href=http://${LAN_IP}:3012"

networks:
  homelab:
    external: true
