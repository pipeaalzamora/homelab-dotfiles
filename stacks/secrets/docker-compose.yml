# =============================================================
# Stack: SECRETS
# Infisical · PostgreSQL · Redis
# Gestión de secretos self-hosted (local-first)
# https://github.com/Infisical/infisical
# =============================================================

networks:
  homelab:
    external: true

services:

  # -----------------------------------------------------------
  # PostgreSQL — base de datos de Infisical
  # -----------------------------------------------------------
  infisical-db:
    image: postgres:14-alpine
    container_name: infisical-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${INFISICAL_DB_PASSWORD}
      POSTGRES_DB: infisical
    volumes:
      - ${HOMELAB_ROOT:-/srv}/data/infisical/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=infisical && psql --username=infisical --list"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - homelab

  # -----------------------------------------------------------
  # Redis — cache / colas de Infisical
  # -----------------------------------------------------------
  infisical-redis:
    image: redis:7-alpine
    container_name: infisical-redis
    restart: unless-stopped
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - ${HOMELAB_ROOT:-/srv}/data/infisical/redis:/data
    networks:
      - homelab

  # -----------------------------------------------------------
  # Infisical — backend + UI (corre migraciones al arrancar)
  # Puerto interno: 8080 · UI local: 127.0.0.1:8083
  # -----------------------------------------------------------
  infisical:
    image: infisical/infisical:latest
    container_name: infisical
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_started
    environment:
      NODE_ENV: production
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET}
      DB_CONNECTION_URI: postgres://infisical:${INFISICAL_DB_PASSWORD}@infisical-db:5432/infisical
      REDIS_URL: redis://infisical-redis:6379
      SITE_URL: ${INFISICAL_SITE_URL:-http://localhost:8083}
      TELEMETRY_ENABLED: ${INFISICAL_TELEMETRY_ENABLED:-false}
    ports:
      - "127.0.0.1:8083:8080"
    networks:
      - homelab
