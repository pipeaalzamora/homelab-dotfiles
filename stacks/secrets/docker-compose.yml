version: '3.8'

services:
  infisical-postgres:
    image: postgres:15-alpine
    container_name: infisical-postgres
    restart: unless-stopped
    volumes:
      - ${HOMELAB_ROOT}/data/infisical/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=infisical
      - POSTGRES_USER=infisical
      - POSTGRES_PASSWORD=infisical_password_change_me
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 10s
      timeout: 5s
      retries: 5

  infisical-redis:
    image: redis:7-alpine
    container_name: infisical-redis
    restart: unless-stopped
    volumes:
      - ${HOMELAB_ROOT}/data/infisical/redis:/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  infisical:
    image: infisical/infisical:latest
    container_name: infisical
    restart: unless-stopped
    ports:
      - "3010:8080"
    volumes:
      - ${HOMELAB_ROOT}/data/infisical/app:/app/data
    environment:
      - DATABASE_URL=postgresql://infisical:infisical_password_change_me@infisical-postgres/infisical
      - REDIS_URL=redis://infisical-redis:6379
      - ENCRYPTION_KEY=change_this_to_a_random_64_char_encryption_key
    depends_on:
      infisical-postgres:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    networks:
      - homelab
    labels:
      - "homepage.group=Secrets"
      - "homepage.name=Infisical"
      - "homepage.description=Gestió±±±n centralizada de secretos (alternativa a 1Password)"
      - "homepage.icon=infisical.svg"
      - "homepage.href=http://${LAN_IP}:3010"

networks:
  homelab:
    external: true
