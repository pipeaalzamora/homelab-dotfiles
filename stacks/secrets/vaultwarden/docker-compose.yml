services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - ${HOMELAB_ROOT}/data/vaultwarden:/data
    environment:
      - DOMAIN=https://${LAN_IP}:8443
      - SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS:-true}
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN:?defini VAULTWARDEN_ADMIN_TOKEN en .env}
    networks:
      - homelab

  caddy-vaultwarden:
    image: caddy:2-alpine
    container_name: caddy-vaultwarden
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ${HOMELAB_ROOT}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${HOMELAB_ROOT}/caddy/data:/data
      - ${HOMELAB_ROOT}/caddy/config:/config
    depends_on:
      - vaultwarden
    networks:
      - homelab

networks:
  homelab:
    external: true
