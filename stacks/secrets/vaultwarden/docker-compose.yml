services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "8222:80"
    volumes:
      - ${HOMELAB_ROOT}/data/vaultwarden:/data
    environment:
      - DOMAIN=http://192.168.1.2:8222
      - SIGNUPS_ALLOWED=true
      - ADMIN_TOKEN=change_this_to_a_random_64_char_admin_token_please
      - WEBSOCKET_ENABLED=true
    networks:
      - homelab

networks:
  homelab:
    external: true
