services:
  vikunja:
    image: vikunja/vikunja:2.6.0
    container_name: vikunja
    environment:
      VIKUNJA_SERVICE_PUBLICURL: http://${LAN_IP}:3456/
      VIKUNJA_SERVICE_SECRET: aad48f92ab06542dab95d98d33c892024e6e976b90924dfa8f59d77cf1ee1b28
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
    ports:
      - 3456:3456
    volumes:
      - ${HOMELAB_ROOT}/data/vikunja/files:/app/vikunja/files
      - ${HOMELAB_ROOT}/data/vikunja/db:/db
    restart: unless-stopped
    networks:
      - homelab

  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: excalidraw
    restart: unless-stopped
    ports:
      - "3008:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - homelab

  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "3009:8080"
    volumes:
      - ${HOMELAB_ROOT}/data/stirling-pdf/data:/usr/share/tessdata
      - ${HOMELAB_ROOT}/data/stirling-pdf/config:/configs
      - ${HOMELAB_ROOT}/data/stirling-pdf/custom:/customFiles
    environment:
      - DOCKER_ENABLE_SECURITY=false
    healthcheck:
      test: "curl -f http://localhost:8080/api/v1/info/status"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - homelab

  nextcloud-db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    volumes:
      - ${HOMELAB_ROOT}/data/nextcloud/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD:-nextcloud_secret}
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud:
    image: nextcloud:29
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "3011:80"
    depends_on:
      nextcloud-db:
        condition: service_healthy
    volumes:
      - ${HOMELAB_ROOT}/data/nextcloud/data:/var/www/html
    environment:
      - POSTGRES_HOST=nextcloud-db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD:-nextcloud_secret}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:-nextcloud_admin}
      - NEXTCLOUD_TRUSTED_DOMAINS=${LAN_IP}
    networks:
      - homelab

  penpot-frontend:
    image: "penpotapp/frontend:latest"
    container_name: penpot-frontend
    restart: unless-stopped
    ports:
      - "9001:8080"
    volumes:
      - ${HOMELAB_ROOT}/data/penpot/assets:/opt/data/assets
    depends_on:
      - penpot-backend
    networks:
      - homelab
    environment:
      - PENPOT_PUBLIC_URI=http://${LAN_IP}:9001
      - PENPOT_FLAGS=disable-email-verification disable-secure-session-cookies

  penpot-backend:
    image: "penpotapp/backend:latest"
    container_name: penpot-backend
    restart: unless-stopped
    volumes:
      - ${HOMELAB_ROOT}/data/penpot/assets:/opt/data/assets
    depends_on:
      - penpot-postgres
      - penpot-valkey
    networks:
      - homelab
    environment:
      - PENPOT_PUBLIC_URI=http://${LAN_IP}:9001
      - PENPOT_SECRET_KEY=zL8mxwhERglB9is1CBJdqRmNrIiOS4PnugpZbn1fGgtMrOH5ROYqXQRxI_T9iv2_DDNZo-ViZlUGY2dHREWhIg
      - PENPOT_DATABASE_URI=postgresql://penpot-postgres/penpot
      - PENPOT_DATABASE_USERNAME=penpot
      - PENPOT_DATABASE_PASSWORD=penpot
      - PENPOT_REDIS_URI=redis://penpot-valkey/0
      - PENPOT_OBJECTS_STORAGE_BACKEND=fs
      - PENPOT_OBJECTS_STORAGE_FS_DIRECTORY=/opt/data/assets
      - PENPOT_SMTP_HOST=penpot-mailcatch
      - PENPOT_SMTP_PORT=1025
      - PENPOT_SMTP_DEFAULT_FROM=no-reply@penpot.local

  penpot-exporter:
    image: penpotapp/exporter:latest
    container_name: penpot-exporter
    restart: unless-stopped
    networks:
      - homelab
    environment:
      - PENPOT_PUBLIC_URI=http://penpot-frontend:8080
      - PENPOT_REDIS_URI=redis://penpot-valkey/0
      - PENPOT_SECRET_KEY=zL8mxwhERglB9is1CBJdqRmNrIiOS4PnugpZbn1fGgtMrOH5ROYqXQRxI_T9iv2_DDNZo-ViZlUGY2dHREWhIg

  penpot-postgres:
    image: postgres:15
    container_name: penpot-postgres
    restart: unless-stopped
    volumes:
      - ${HOMELAB_ROOT}/data/penpot/db:/var/lib/postgresql/data
    networks:
      - homelab
    environment:
      - POSTGRES_DB=penpot
      - POSTGRES_USER=penpot
      - POSTGRES_PASSWORD=penpot

  penpot-valkey:
    image: valkey/valkey:8.1
    container_name: penpot-valkey
    restart: unless-stopped
    networks:
      - homelab

  penpot-mailcatch:
    image: sj26/mailcatcher:latest
    container_name: penpot-mailcatch
    restart: unless-stopped
    ports:
      - "1080:1080"
    networks:
      - homelab



networks:
  homelab:
    external: true
