services:
  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: excalidraw
    restart: unless-stopped
    ports:
      - "3008:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - homelab

  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "3009:3000"
    volumes:
      - ${HOMELAB_ROOT}/data/stirling-pdf/data:/usr/share/tessdata
      - ${HOMELAB_ROOT}/data/stirling-pdf/config:/configs
      - ${HOMELAB_ROOT}/data/stirling-pdf/custom:/customFiles
    environment:
      - DOCKER_ENABLE_SECURITY=false
    healthcheck:
      test: "curl -f http://localhost:3000/api/v1/info/status | grep -q 'UP'"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - homelab

  nextcloud-aio:
    image: ghcr.io/nextcloud-releases/all-in-one:latest
    container_name: nextcloud-aio-mastercontainer
    restart: unless-stopped
    ports:
      - "81:80"
      - "8180:8080"
      - "8444:8443"
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - APACHE_PORT=11000
      - APACHE_IP_BINDING=0.0.0.0
      - SKIP_DOMAIN_VALIDATION=true
      - NEXTCLOUD_DATADIR=/mnt/docker-aio-config/data
    networks:
      - homelab

volumes:
  nextcloud_aio_mastercontainer:

networks:
  homelab:
    external: true
