

services:
  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: excalidraw
    restart: unless-stopped
    ports:
      - "3008:80"
    networks:
      - homelab
    labels:
      - "homepage.group=Productivity"
      - "homepage.name=Excalidraw"
      - "homepage.description=Herramienta de diagramas y pizarra blanca"
      - "homepage.icon=excalidraw.svg"
      - "homepage.href=http://${LAN_IP}:3008"

  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "3009:3000"
    volumes:
      - ${HOMELAB_ROOT}/data/stirling-pdf:/usr/share/tessdata
    environment:
      - DOCKER_ENABLE_SECURITY=false
    networks:
      - homelab
    labels:
      - "homepage.group=Productivity"
      - "homepage.name=Stirling-PDF"
      - "homepage.description=Herramientas PDF (convertir, editar, firmar)"
      - "homepage.icon=stirling-pdf.svg"
      - "homepage.href=http://${LAN_IP}:3009"

networks:
  homelab:
    external: true
