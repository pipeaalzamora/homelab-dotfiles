# =============================================================
# Stack: OPTIONAL TOOLS
# n8n
# Automatizaciones locales. Instalar solo cuando tengas flujos concretos.
# =============================================================

networks:
  homelab:
    external: true

services:

  n8n-db:
    image: postgres:15-alpine
    container_name: n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - ${HOMELAB_ROOT:-/srv}/data/n8n/db:/var/lib/postgresql/data
    networks:
      - homelab

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      - n8n-db
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      DB_POSTGRESDB_DATABASE: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-pipe}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      GENERIC_TIMEZONE: ${TZ:-America/Santiago}
      TZ: ${TZ:-America/Santiago}
    volumes:
      - ${HOMELAB_ROOT:-/srv}/data/n8n/app:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    networks:
      - homelab
