# =============================================================
# Stack: TOOLS
# n8n · Homepage · Uptime Kuma · Restic Backups
# Día 5 — Automatización y tablero central
# =============================================================

networks:
  homelab:
    external: true

services:

  # -----------------------------------------------------------
  # n8n — Automatización de flujos (alternativa a Zapier)
  # Puerto: 5678
  # -----------------------------------------------------------
  n8n-db:
    image: postgres:15-alpine
    container_name: n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_ENCRYPTION_KEY}
      POSTGRES_DB: n8n
    volumes:
      - /srv/data/n8n/db:/var/lib/postgresql/data
    networks:
      - homelab

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      - n8n-db
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_ENCRYPTION_KEY}
      DB_POSTGRESDB_DATABASE: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-pipe}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      GENERIC_TIMEZONE: ${TZ:-America/Santiago}
      TZ: ${TZ:-America/Santiago}
    volumes:
      - /srv/data/n8n:/home/node/.n8n
    ports:
      - "5678:5678"
    networks:
      - homelab

  # -----------------------------------------------------------
  # Homepage — Tablero central del homelab
  # Puerto: 3001
  # Config en: /srv/data/homepage/config/
  # -----------------------------------------------------------
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Santiago}
    volumes:
      - /srv/data/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3001:3000"
    networks:
      - homelab

  # -----------------------------------------------------------
  # Uptime Kuma — Monitor de disponibilidad de servicios
  # Puerto: 3002
  # -----------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Santiago}
    volumes:
      - /srv/data/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3002:3001"
    networks:
      - homelab

  # -----------------------------------------------------------
  # Restic — Backups cifrados automáticos
  # Cron diario a las 02:00
  # -----------------------------------------------------------
  restic:
    image: mazzolino/restic:latest
    container_name: restic
    restart: unless-stopped
    hostname: homelab-pipe
    environment:
      TZ: ${TZ:-America/Santiago}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/mnt/restic-repo}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      BACKUP_CRON: "0 2 * * *"    # Diario a las 02:00
      RESTIC_BACKUP_SOURCES: /data
      RESTIC_BACKUP_ARGS: >-
        --tag homelab
        --exclude=/data/jellyfin/cache
        --exclude=/data/immich/upload
      RESTIC_FORGET_ARGS: >-
        --keep-last 7
        --keep-daily 14
        --keep-weekly 4
        --keep-monthly 3
      # Backblaze B2 (opcional — descomentar y rellenar en .env)
      # B2_ACCOUNT_ID: ${B2_ACCOUNT_ID}
      # B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY}
    volumes:
      - /srv/data:/data:ro
      - /srv/homelab:/srv/homelab:ro
      - /srv/backups/restic-repo:/mnt/restic-repo
    networks:
      - homelab
