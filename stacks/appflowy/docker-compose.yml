services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=appflowy
      - POSTGRES_DB=appflowy
      - POSTGRES_PASSWORD=nRnn826pgqCKdmrkUyHbugh9e8aN7pnt9k57ddPQmkj
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - appflowy_net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "appflowy", "-d", "appflowy"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    networks:
      - appflowy_net

  minio:
    restart: unless-stopped
    image: minio/minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadminsecret123
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    networks:
      - appflowy_net

  gotrue:
    image: appflowyinc/gotrue:latest
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      GOTRUE_ADMIN_EMAIL: admin@homelab.local
      GOTRUE_ADMIN_PASSWORD: nRnn826pgqCKdmrkUyHbugh9e8aN7pnt9k57ddPQmkj
      GOTRUE_JWT_SECRET: JssAojjWYw4lu5a5nsmEWoqYoHCQuxaBe6YFhAE4eH0
      GOTRUE_JWT_EXP: "7200"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_SITE_URL: appflowy-flutter://
      API_EXTERNAL_URL: http://192.168.1.2:9999
      DATABASE_URL: postgresql://appflowy:nRnn826pgqCKdmrkUyHbugh9e8aN7pnt9k57ddPQmkj@postgres/appflowy?search_path=auth
      GOTRUE_DATABASE_URL: postgresql://appflowy:nRnn826pgqCKdmrkUyHbugh9e8aN7pnt9k57ddPQmkj@postgres/appflowy?search_path=auth
      PORT: "9999"
      GOTRUE_URI_ALLOW_LIST: "**"
      GOTRUE_JWT_ADMIN_GROUP_NAME: supabase_admin
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appflowy_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9999/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  appflowy_cloud:
    restart: unless-stopped
    image: appflowyinc/appflowy_cloud:0.16.3
    ports:
      - "8000:8000"
    environment:
      - APPFLOWY_ENVIRONMENT=development
      - APPFLOWY_BASE_URL=http://192.168.1.2:8000
      - APPFLOWY_DATABASE_URL=postgresql://appflowy:nRnn826pgqCKdmrkUyHbugh9e8aN7pnt9k57ddPQmkj@postgres/appflowy
      - APPFLOWY_REDIS_URI=redis://redis:6379
      - APPFLOWY_S3_USE_MINIO=true
      - APPFLOWY_S3_MINIO_URL=http://minio:9000
      - APPFLOWY_S3_ACCESS_KEY=minioadmin
      - APPFLOWY_S3_SECRET_KEY=minioadminsecret123
      - APPFLOWY_S3_BUCKET=appflowy
      - APPFLOWY_S3_CREATE_BUCKET=true
      - APPFLOWY_ACCESS_CONTROL=false
      - RUST_LOG=info
      - APPFLOWY_WEB_URL=http://192.168.1.2:8080
      - APPFLOWY_GOTRUE_JWT_SECRET=JssAojjWYw4lu5a5nsmEWoqYoHCQuxaBe6YFhAE4eH0
      - APPFLOWY_GOTRUE_BASE_URL=http://gotrue:9999
      - APPFLOWY_WS_BASE_URL=ws://192.168.1.2:8000/ws/v2
    depends_on:
      gotrue:
        condition: service_healthy
    networks:
      - appflowy_net

  appflowy_web:
    restart: unless-stopped
    image: appflowyinc/appflowy_web:0.16.3
    ports:
      - "8080:80"
    environment:
      - APPFLOWY_BASE_URL=http://192.168.1.2:8000
      - APPFLOWY_GOTRUE_BASE_URL=http://192.168.1.2:9999
      - APPFLOWY_WS_BASE_URL=ws://192.168.1.2:8000/ws/v2
    depends_on:
      - appflowy_cloud
    networks:
      - appflowy_net

networks:
  appflowy_net:
    driver: bridge
