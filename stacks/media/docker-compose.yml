# =============================================================
# Stack: MEDIA
# Jellyfin · Jellyseerr · Sonarr · Radarr · Prowlarr · Bazarr · qBittorrent
# Streaming automático local para uso familiar
# =============================================================

networks:
  homelab:
    external: true

services:

  # -----------------------------------------------------------
  # Jellyfin — Servidor de streaming personal
  # Puerto: 8096
  # -----------------------------------------------------------
  jellyfin:
    image: linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Santiago}
      # JELLYFIN_PublishedServerUrl: https://media.tudominio.com  # Descomentar en producción
    volumes:
      - ${HOMELAB_ROOT:-/srv}/data/jellyfin/config:/config
      - ${HOMELAB_ROOT:-/srv}/data/jellyfin/cache:/cache
      - ${HOMELAB_ROOT:-/srv}/media/movies:/data/movies:ro
      - ${HOMELAB_ROOT:-/srv}/media/series:/data/series:ro
      - ${HOMELAB_ROOT:-/srv}/media/music:/data/music:ro
    ports:
      - "8096:8096"
    # Descomentar para transcoding por GPU NVIDIA (RTX 3060/4060)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - homelab

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-America/Santiago}
    volumes:
      - ${HOMELAB_ROOT:-/srv}/data/jellyseerr/config:/app/config
    ports:
      - "5055:5055"
    networks:
      - homelab

  # -----------------------------------------------------------
  # Sonarr — Descarga automática de series
  # Puerto: 8989
  # -----------------------------------------------------------
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Santiago}
    volumes:
      - ${HOMELAB_ROOT:-/srv}/data/sonarr/config:/config
      - ${HOMELAB_ROOT:-/srv}/media/series:/data/series
      - ${HOMELAB_ROOT:-/srv}/media/downloads:/data/downloads
    ports:
      - "127.0.0.1:8989:8989"
    networks:
      - homelab

  # -----------------------------------------------------------
  # Radarr — Descarga automática de películas
  # Puerto: 7878
  # Fix conocido: deshabilitar IPv6 si falla la conexión
  # -----------------------------------------------------------
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Santiago}
    # Deshabilitar IPv6 si el upstream IPv6 está roto
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    volumes:
      - ${HOMELAB_ROOT:-/srv}/data/radarr/config:/config
      - ${HOMELAB_ROOT:-/srv}/media/movies:/data/movies
      - ${HOMELAB_ROOT:-/srv}/media/downloads:/data/downloads
    ports:
      - "127.0.0.1:7878:7878"
    networks:
      - homelab

  # -----------------------------------------------------------
  # Prowlarr — Indexador central para Sonarr/Radarr
  # Puerto: 9696
  # -----------------------------------------------------------
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Santiago}
    volumes:
      - ${HOMELAB_ROOT:-/srv}/data/prowlarr/config:/config
    ports:
      - "127.0.0.1:9696:9696"
    networks:
      - homelab

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: ${TZ:-America/Santiago}
    ports:
      - "127.0.0.1:8191:8191"
    networks:
      - homelab

  # -----------------------------------------------------------
  # Bazarr — Descarga automática de subtítulos
  # Puerto: 6767
  # -----------------------------------------------------------
  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Santiago}
    volumes:
      - ${HOMELAB_ROOT:-/srv}/data/bazarr/config:/config
      - ${HOMELAB_ROOT:-/srv}/media/movies:/data/movies
      - ${HOMELAB_ROOT:-/srv}/media/series:/data/series
    ports:
      - "127.0.0.1:6767:6767"
    networks:
      - homelab

  # -----------------------------------------------------------
  # qBittorrent — Cliente BitTorrent
  # UI local: http://127.0.0.1:8081
  # -----------------------------------------------------------
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Santiago}
      WEBUI_PORT: 8080
      TORRENTING_PORT: 51413
    volumes:
      - ${HOMELAB_ROOT:-/srv}/data/qbittorrent/config:/config
      - ${HOMELAB_ROOT:-/srv}/media/downloads:/data/downloads
    ports:
      - "127.0.0.1:8081:8080"
      - "51413:51413"
      - "51413:51413/udp"
    networks:
      - homelab
