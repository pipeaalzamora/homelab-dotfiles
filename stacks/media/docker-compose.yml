version: '3.8'

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "3002:8096"
    volumes:
      - ${HOMELAB_ROOT}/data/jellyfin/config:/config
      - ${HOMELAB_ROOT}/data/jellyfin/cache:/cache
      - ${HOMELAB_ROOT}/media:/media:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - 44  # video
      - 990  # render
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    networks:
      - homelab
    labels:
      - "homepage.group=Media"
      - "homepage.name=Jellyfin"
      - "homepage.description=Servidor de multimedia (pelí±± ±culas, series, música)"
      - "homepage.icon=jellyfin.svg"
      - "homepage.href=http://${LAN_IP}:3002"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "3003:8989"
    volumes:
      - ${HOMELAB_ROOT}/data/sonarr:/config
      - ${HOMELAB_ROOT}/media/tv:/media/tv
      - ${HOMELAB_ROOT}/media/downloads:/media/downloads
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Santiago}
    networks:
      - homelab
    labels:
      - "homepage.group=Media"
      - "homepage.name=Sonarr"
      - "homepage.description=Automatizació±±±n de series (TV)"
      - "homepage.icon=sonarr.svg"
      - "homepage.href=http://${LAN_IP}:3003"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - "3004:7878"
    volumes:
      - ${HOMELAB_ROOT}/data/radarr:/config
      - ${HOMELAB_ROOT}/media/movies:/media/movies
      - ${HOMELAB_ROOT}/media/downloads:/media/downloads
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Santiago}
    networks:
      - homelab
    labels:
      - "homepage.group=Media"
      - "homepage.name=Radarr"
      - "homepage.description=Automatizació±±±n de pelí±± ±culas"
      - "homepage.icon=radarr.svg"
      - "homepage.href=http://${LAN_IP}:3004"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "3005:9696"
    volumes:
      - ${HOMELAB_ROOT}/data/prowlarr:/config
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Santiago}
    networks:
      - homelab
    labels:
      - "homepage.group=Media"
      - "homepage.name=Prowlarr"
      - "homepage.description=Í± ±ndice de torrents (Sonarr/Radarr)"
      - "homepage.icon=prowlarr.svg"
      - "homepage.href=http://${LAN_IP}:3005"

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    ports:
      - "3006:6767"
    volumes:
      - ${HOMELAB_ROOT}/data/bazarr:/config
      - ${HOMELAB_ROOT}/media/movies:/media/movies
      - ${HOMELAB_ROOT}/media/tv:/media/tv
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Santiago}
    networks:
      - homelab
    labels:
      - "homepage.group=Media"
      - "homepage.name=Bazarr"
      - "homepage.description=Subtí±± ±tulos para Sonarr/Radarr"
      - "homepage.icon=bazarr.svg"
      - "homepage.href=http://${LAN_IP}:3006"

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped
    ports:
      - "3007:8080"
      - "51413:51413"
      - "51413:51413/udp"
    volumes:
      - ${HOMELAB_ROOT}/data/transmission:/config
      - ${HOMELAB_ROOT}/media/downloads:/media/downloads
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Santiago}
      - USER=${TRANSMISSION_USER:-admin}
      - PASS=${TRANSMISSION_PASS:-admin}
    networks:
      - homelab
    labels:
      - "homepage.group=Media"
      - "homepage.name=Transmission"
      - "homepage.description=Cliente de torrents"
      - "homepage.icon=transmission.svg"
      - "homepage.href=http://${LAN_IP}:3007"

networks:
  homelab:
    external: true
